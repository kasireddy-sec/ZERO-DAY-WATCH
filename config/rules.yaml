zero_day:
  minimum_confidence: 0.80
  strong_signals:
    - previously_unknown
    - active_exploitation
    - exploited_in_the_wild
    - no_patch
    - vendor_notified
  weak_signals:
    - poc_available
    - exploit_code_available
  require_evidence: true
  poc_alone_is_not_zero_day: true

crawler:
  max_depth: 3
  high_confidence_max_depth: 5
  max_urls_per_root: 25
  max_response_bytes: 5242880
  timeout_seconds: 20
  max_redirects: 5
